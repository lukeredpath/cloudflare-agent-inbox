name: Pages

# Publishes the static project page in site/. Nothing here touches Cloudflare;
# deploys of the Worker itself are not run from GitHub.

on:
  push:
    branches: [main]
    paths: [site/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v5
      # The page uses placeholders, so no owner, repo name or personal domain
      # is committed. The repo link comes from the repository itself; the
      # author link from the AUTHOR_URL repository variable (Settings >
      # Secrets and variables > Actions > Variables). Without it, the line
      # is dropped.
      - env:
          AUTHOR_URL: ${{ vars.AUTHOR_URL }}
        run: |
          cp -r site _site
          sed -i "s#__REPO__#${GITHUB_REPOSITORY}#g" _site/index.html
          if [ -n "$AUTHOR_URL" ]; then
            sed -i "s#__AUTHOR_URL__#${AUTHOR_URL}#g" _site/index.html
          else
            sed -i "/__AUTHOR_URL__/d" _site/index.html
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
